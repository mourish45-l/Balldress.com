<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balldress Buyer | Emerald Edition</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }
        .m3-card {
            background: white;
            border-radius: 28px;
            border: 1px solid #dcfce7;
            transition: all 0.3s ease;
        }
        .m3-btn-green {
            background-color: #16a34a;
            color: white;
            border-radius: 20px;
            transition: all 0.2s;
            font-weight: 600;
        }
        .m3-btn-green:hover {
            background-color: #15803d;
        }
        .nav-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #dcfce7;
        }
        .nav-icon.active {
            color: #16a34a;
            background-color: #f0fdf4;
            border-radius: 9999px;
        }
        #status-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 600;
            display: none;
        }
        .out-of-stock {
            filter: grayscale(1);
            opacity: 0.5;
            pointer-events: none;
        }
        .order-item-pill {
            background: #f8fafc;
            border-radius: 40px;
            padding: 4px 12px 4px 8px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        .order-item-pill i {
            font-size: 12px;
            color: #16a34a;
        }
        .product-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #f1f5f9;
            padding: 2px 10px 2px 6px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
    </style>
</head>
<body class="pb-24">

    <div id="status-msg"></div>

    <div id="loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-emerald-600 font-bold">Connecting to Cloud...</p>
    </div>

    <nav class="sticky top-0 z-40 nav-glass">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showView('home')">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-pen-nib"></i>
                </div>
                <h1 class="text-xl font-extrabold text-slate-900">Balldress <span class="text-emerald-600">Buyer</span></h1>
            </div>
            <div id="nav-actions"></div>
        </div>
    </nav>

    <main id="main-content" class="max-w-4xl mx-auto p-4 pt-6"></main>

    <div id="bottom-bar" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-xl border border-emerald-100 shadow-2xl rounded-full px-6 py-2 flex items-center gap-6 z-50 hidden">
        <button onclick="showView('home')" class="nav-icon p-3 text-slate-400" data-v="home"><i class="fa-solid fa-house"></i></button>
        <button onclick="showView('orders')" class="nav-icon p-3 text-slate-400" data-v="orders"><i class="fa-solid fa-box-open"></i></button>
        <button onclick="showView('cart')" class="nav-icon p-3 text-slate-400 relative" data-v="cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="absolute top-1 right-1 bg-emerald-600 text-white text-[10px] w-4 h-4 rounded-full hidden flex items-center justify-center font-bold">0</span>
        </button>
        <button id="admin-icon" onclick="showView('admin')" class="nav-icon p-3 hidden text-emerald-400" data-v="admin"><i class="fa-solid fa-shield-halved"></i></button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp0BeH1zgsKRGI4itBpur919WX0FIg-uo",
            authDomain: "whupm-13cab.firebaseapp.com",
            databaseURL: "https://whupm-13cab-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "whupm-13cab",
            storageBucket: "whupm-13cab.firebasestorage.app",
            messagingSenderId: "178241688205",
            appId: "1:178241688205:web:d6e36734d4dac1440a08c4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const ADMIN_EMAIL = "mourishnithin@outlook.com";
        const ADMIN_PASS_SECRET = "230914";

        const PRODUCTS = [
            { id: 'p1', name: 'Parker Beta Standard', price: 250, icon: 'fa-pen-clip' },
            { id: 'p2', name: 'Figo panda liquid roller (Blue)', price: 70, icon: 'fa-pen-fancy' },
            { id: 'p3-blue', name: 'Pilot V7 (Blue)', price: 60, icon: 'fa-pen-nib' },
            { id: 'p3-black', name: 'Pilot V7 (Black)', price: 90, icon: 'fa-pen-nib' },
            { id: 'p4-blue', name: 'Reynold 045 (Blue)', price: 2, icon: 'fa-pencil' },
            { id: 'p4-black', name: 'Reynold 045 (Black)', price: 5, icon: 'fa-pencil' }
        ];

        let cart = [];
        let stockData = {};
        let currentActiveView = 'home';
        let ordersListener = null; // track listener to avoid duplicates

        // --- GLOBAL REAL-TIME STOCK LISTENER ---
        onValue(ref(db, 'stock'), (snapshot) => {
            stockData = snapshot.val() || {};
            console.log("Syncing stock from cloud...", stockData);
            if (currentActiveView === 'home') renderHome();
            if (currentActiveView === 'admin') renderAdmin();
        });

        window.showMessage = (text, type = 'info') => {
            const el = document.getElementById('status-msg');
            el.innerText = text;
            el.style.display = 'block';
            el.className = type === 'error' ? 'bg-red-600 text-white shadow-xl' : 'bg-slate-800 text-white shadow-xl';
            setTimeout(() => { el.style.display = 'none'; }, 2000);
        };

        window.showView = (v) => {
            currentActiveView = v;
            document.querySelectorAll('.nav-icon').forEach(i => {
                i.classList.toggle('active', i.dataset.v === v);
            });
            if (v === 'home') renderHome();
            else if (v === 'login') renderAuth('login');
            else if (v === 'signup') renderAuth('signup');
            else if (v === 'cart') renderCart();
            else if (v === 'orders') renderOrders();
            else if (v === 'admin') renderAdmin();
        };

        // --- STOCK TOGGLE ---
        window.toggleStock = (productId, targetValue) => {
            set(ref(db, `stock/${productId}`), targetValue)
                .then(() => showMessage("Inventory Updated"))
                .catch(err => showMessage("Error: " + err.message, "error"));
        };

        // --- RENDER HOME ---
        function renderHome() {
            let html = `<div class="mb-6 p-6 bg-emerald-100 rounded-[32px] border border-emerald-200">
                <h2 class="text-2xl font-black text-emerald-900">Premium Pens</h2>
                <p class="text-emerald-700 font-medium text-sm">Real-time inventory active.</p>
            </div><div class="grid grid-cols-2 gap-4">`;

            PRODUCTS.forEach(p => {
                const isOut = stockData[p.id] === true;
                html += `
                    <div class="m3-card p-5 flex flex-col items-center text-center ${isOut ? 'out-of-stock' : ''}">
                        <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-xl text-emerald-600 mb-3">
                            <i class="fa-solid ${p.icon}"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-xs h-8 overflow-hidden">${p.name}</h3>
                        <p class="text-emerald-700 font-black my-3">${p.price} BD</p>
                        ${isOut ?
                            `<div class="w-full py-2 bg-slate-200 text-slate-500 rounded-xl text-[10px] font-black uppercase">Out of Stock</div>` :
                            `<button onclick="addToCart('${p.id}')" class="m3-btn-green w-full py-2 text-xs">Add to Bag</button>`
                        }
                    </div>`;
            });
            document.getElementById('main-content').innerHTML = html + `</div>`;
        }

        // --- RENDER ADMIN (with product details in orders) ---
        function renderAdmin() {
            let html = `<h2 class="text-xl font-black mb-6">Inventory Control</h2>
            <div class="bg-white p-6 rounded-[32px] border border-emerald-100 mb-6">
                <div class="space-y-3">
                    ${PRODUCTS.map(p => {
                        const isOut = stockData[p.id] === true;
                        return `
                            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                                <span class="text-xs font-bold text-slate-700">${p.name}</span>
                                <button onclick="toggleStock('${p.id}', ${!isOut})" class="px-4 py-2 rounded-xl text-[10px] font-black transition-colors ${isOut ? 'bg-red-500 text-white' : 'bg-emerald-100 text-emerald-700'}">
                                    ${isOut ? 'MARK AS IN STOCK' : 'MARK AS OUT'}
                                </button>
                            </div>`;
                    }).join('')}
                </div>
            </div>
            <div id="admin-orders"></div>`;

            document.getElementById('main-content').innerHTML = html;

            // Remove old listener if any
            if (ordersListener) {
                ordersListener();
                ordersListener = null;
            }

            // Attach fresh listener for admin orders
            const ordersRef = ref(db, 'orders');
            ordersListener = onValue(ordersRef, (snap) => {
                let oHtml = `<h3 class="font-bold px-2 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-emerald-600"></i> All Customer Orders
                    <span class="text-xs text-slate-400 font-normal ml-2">(${snap.size})</span>
                </h3>`;

                if (snap.size === 0) {
                    oHtml += `<div class="bg-white p-8 rounded-3xl text-center text-slate-400 border border-emerald-50">No orders yet.</div>`;
                } else {
                    snap.forEach(c => {
                        const o = c.val();
                        const items = o.items || [];
                        const total = o.total || items.reduce((s, i) => s + (i.price * i.qty), 0);

                        oHtml += `
                            <div class="bg-white p-5 rounded-3xl border border-emerald-50 mb-4 shadow-sm">
                                <div class="flex flex-wrap items-start justify-between gap-2 mb-3">
                                    <div>
                                        <span class="text-[10px] font-black text-slate-300 bg-slate-100 px-2 py-1 rounded-lg">#${c.key.slice(-6)}</span>
                                        <span class="text-xs font-semibold text-slate-600 ml-2"><i class="fa-regular fa-envelope"></i> ${o.userEmail || 'unknown'}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-sm font-black text-emerald-700">${total} BD</span>
                                        <span class="px-2 py-1 rounded-lg text-[10px] font-bold ${o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-700' : o.status === 'Shipped' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">${o.status || 'Processing'}</span>
                                    </div>
                                </div>

                                <!-- Product list -->
                                <div class="flex flex-wrap gap-1.5 mt-2 mb-3">
                                    ${items.length > 0 ? items.map(item => `
                                        <span class="order-item-pill">
                                            <i class="fa-solid ${item.icon || 'fa-pen'}"></i>
                                            ${item.name} <span class="text-emerald-600 font-black">×${item.qty}</span>
                                            <span class="text-slate-400 text-[10px]">(${item.price * item.qty} BD)</span>
                                        </span>
                                    `).join('') : `<span class="text-xs text-slate-400 italic">No items listed</span>`}
                                </div>

                                <div class="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-slate-100">
                                    <select onchange="updateStatus('${c.key}', this.value)" class="flex-1 min-w-[120px] bg-slate-50 p-2.5 rounded-xl text-xs font-bold border-none focus:ring-2 focus:ring-emerald-300 outline-none">
                                        <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                        <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                        <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                    </select>
                                    <button onclick="deleteOrder('${c.key}')" class="px-4 py-2.5 bg-red-50 text-red-400 rounded-xl hover:bg-red-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('admin-orders').innerHTML = oHtml;
            });
        }

        // --- CART ---
        window.addToCart = (id) => {
            const p = PRODUCTS.find(x => x.id === id);
            if (!p) return;
            const ex = cart.find(x => x.id === id);
            if (ex) ex.qty++;
            else cart.push({ ...p, qty: 1 });
            updateUI();
            showMessage("Added to bag");
        };

        window.changeQty = (id, d) => {
            const item = cart.find(x => x.id === id);
            if (item) {
                item.qty += d;
                if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
            }
            updateUI();
            renderCart();
        };

        function updateUI() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const c = document.getElementById('cart-count');
            c.innerText = count;
            c.classList.toggle('hidden', count === 0);
        }

        function renderCart() {
            let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let html = `<h2 class="text-xl font-black mb-6">Your Bag</h2>`;
            if (cart.length === 0) {
                html += `<div class="p-10 text-center text-slate-400 bg-white rounded-[32px]">Empty</div>`;
            } else {
                cart.forEach(item => {
                    html += `
                        <div class="bg-white p-4 rounded-3xl flex items-center justify-between mb-3 border border-emerald-50">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600">
                                    <i class="fa-solid ${item.icon}"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-sm">${item.name}</p>
                                    <p class="text-xs text-emerald-500 font-bold">${item.price} BD</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="changeQty('${item.id}', -1)" class="w-8 h-8 bg-slate-100 rounded-lg">−</button>
                                <span class="text-sm font-bold w-6 text-center">${item.qty}</span>
                                <button onclick="changeQty('${item.id}', 1)" class="w-8 h-8 bg-slate-100 rounded-lg">+</button>
                            </div>
                        </div>`;
                });
                html += `
                    <button onclick="checkout()" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black mt-4 shadow-lg">
                        ${total} BD — Place Order
                    </button>`;
            }
            document.getElementById('main-content').innerHTML = html;
        }

        window.checkout = async () => {
            if (!auth.currentUser) return showView('login');
            if (cart.length === 0) return showMessage("Cart is empty!", "error");

            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            await push(ref(db, 'orders'), {
                userId: auth.currentUser.uid,
                userEmail: auth.currentUser.email,
                items: cart.map(i => ({ ...i })), // deep copy
                total: total,
                status: 'Processing',
                date: new Date().toISOString()
            });
            cart = [];
            updateUI();
            showView('orders');
            showMessage("Order Placed! 🎉");
        };

        window.updateStatus = (id, s) => update(ref(db, `orders/${id}`), { status: s });
        window.deleteOrder = (id) => {
            if (confirm("Delete this order?")) set(ref(db, `orders/${id}`), null);
        };

        // --- RENDER USER ORDERS (with product details) ---
        function renderOrders() {
            document.getElementById('main-content').innerHTML = `
                <h2 class="text-xl font-black mb-6">Your Orders</h2>
                <div id="user-orders" class="space-y-3"></div>
            `;

            // Remove old listener if any
            if (ordersListener) {
                ordersListener();
                ordersListener = null;
            }

            const ordersRef = ref(db, 'orders');
            ordersListener = onValue(ordersRef, (snap) => {
                const container = document.getElementById('user-orders');
                if (!container) return;

                let html = '';
                let found = false;

                snap.forEach(c => {
                    const o = c.val();
                    if (auth.currentUser && o.userId === auth.currentUser.uid) {
                        found = true;
                        const items = o.items || [];
                        const total = o.total || items.reduce((s, i) => s + (i.price * i.qty), 0);

                        html += `
                            <div class="bg-white p-5 rounded-3xl border border-emerald-50 shadow-sm">
                                <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
                                    <span class="text-[10px] font-black text-slate-300 bg-slate-100 px-2 py-1 rounded-lg">#${c.key.slice(-6)}</span>
                                    <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold ${o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-700' : o.status === 'Shipped' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">${o.status || 'Processing'}</span>
                                </div>

                                <!-- Product list -->
                                <div class="flex flex-wrap gap-1.5 my-2">
                                    ${items.length > 0 ? items.map(item => `
                                        <span class="order-item-pill">
                                            <i class="fa-solid ${item.icon || 'fa-pen'}"></i>
                                            ${item.name} <span class="text-emerald-600 font-black">×${item.qty}</span>
                                        </span>
                                    `).join('') : `<span class="text-xs text-slate-400 italic">No items</span>`}
                                </div>

                                <div class="flex justify-between items-center mt-3 pt-3 border-t border-slate-100">
                                    <span class="text-sm font-black text-emerald-700">${total} BD</span>
                                    <span class="text-[10px] text-slate-400">${o.date ? new Date(o.date).toLocaleDateString() : ''}</span>
                                </div>
                            </div>`;
                    }
                });

                container.innerHTML = found ? html : `<div class="bg-white p-10 rounded-3xl text-center text-slate-400 border border-emerald-50">You haven't placed any orders yet.</div>`;
            });
        }

        // --- AUTH ---
        function renderAuth(type) {
            document.getElementById('main-content').innerHTML = `
                <div class="max-w-sm mx-auto bg-white p-8 rounded-[40px] shadow-2xl mt-10">
                    <h2 class="text-2xl font-black text-center mb-6">${type === 'login' ? 'Welcome Back' : 'Create Account'}</h2>
                    <form id="auth-form" class="space-y-4">
                        <input type="email" id="email" placeholder="Email" class="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-300" required>
                        <input type="password" id="pass" placeholder="Password" class="w-full bg-slate-50 p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-300" required>
                        <button type="submit" class="w-full m3-btn-green py-4 mt-2">Continue</button>
                    </form>
                    <p class="text-center mt-6 text-sm text-slate-400 cursor-pointer" onclick="showView('${type === 'login' ? 'signup' : 'login'}')">
                        ${type === 'login' ? 'New here? <span class="text-emerald-600 font-bold">Sign up</span>' : 'Have an account? <span class="text-emerald-600 font-bold">Login</span>'}
                    </p>
                </div>`;

            document.getElementById('auth-form').onsubmit = async (e) => {
                e.preventDefault();
                const em = document.getElementById('email').value;
                const pw = document.getElementById('pass').value;
                try {
                    if (type === 'login') {
                        await signInWithEmailAndPassword(auth, em, (em === ADMIN_EMAIL ? ADMIN_PASS_SECRET : pw));
                    } else {
                        await createUserWithEmailAndPassword(auth, em, pw);
                    }
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            };
        }

        // --- AUTH STATE ---
        onAuthStateChanged(auth, (u) => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('bottom-bar').classList.toggle('hidden', !u);
            const nav = document.getElementById('nav-actions');

            if (u) {
                nav.innerHTML = `
                    <button id="logout-btn" class="w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition">
                        <i class="fa-solid fa-power-off"></i>
                    </button>`;
                document.getElementById('logout-btn').onclick = () => signOut(auth);
                document.getElementById('admin-icon').classList.toggle('hidden', u.email !== ADMIN_EMAIL);

                // Clean up old orders listener on auth change
                if (ordersListener) {
                    ordersListener();
                    ordersListener = null;
                }

                // Show default view
                if (u.email === ADMIN_EMAIL) {
                    showView('admin');
                } else {
                    showView('home');
                }
            } else {
                nav.innerHTML = `<button onclick="showView('login')" class="m3-btn-green px-6 py-2 text-sm">Login</button>`;
                showView('home');
            }
        });
    </script>
</body>
</html>
