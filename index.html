<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Balldress Buyer | Emerald Edition</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f0fdf4;
            -webkit-tap-highlight-color: transparent;
        }
        .m3-card {
            background: white;
            border-radius: 28px;
            border: 1px solid #dcfce7;
            transition: all 0.2s ease;
        }
        .m3-btn-green {
            background-color: #16a34a;
            color: white;
            border-radius: 20px;
            transition: all 0.2s;
            font-weight: 600;
        }
        .m3-btn-green:hover {
            background-color: #15803d;
        }
        .m3-btn-green:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .nav-glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid #dcfce7;
        }
        .nav-icon.active {
            color: #16a34a;
            background-color: #f0fdf4;
            border-radius: 9999px;
        }
        #status-msg {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 12px 24px;
            border-radius: 16px;
            font-weight: 600;
            display: none;
            max-width: 90%;
            text-align: center;
        }
        .out-of-stock {
            filter: grayscale(1);
            opacity: 0.5;
            pointer-events: none;
        }
        .stock-badge {
            font-size: 10px;
            background: #e2e8f0;
            padding: 2px 10px;
            border-radius: 20px;
            color: #1e293b;
            font-weight: 600;
        }
        .wishlist-heart {
            transition: 0.2s;
            cursor: pointer;
        }
        .wishlist-heart:hover {
            transform: scale(1.2);
        }
        .order-timeline {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .timeline-step {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }
        .timeline-step.active {
            color: #16a34a;
        }
        .timeline-step.done {
            color: #16a34a;
        }
        .timeline-line {
            width: 30px;
            height: 2px;
            background: #cbd5e1;
        }
        .timeline-line.done {
            background: #16a34a;
        }
        .star-rating {
            color: #fbbf24;
            font-size: 14px;
        }
        .review-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 6px;
        }
        .review-item .stars {
            color: #fbbf24;
            font-size: 12px;
        }
        .address-field {
            width: 100%;
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid #d1d5db;
            background: #f9fafb;
            font-size: 14px;
        }
        .address-field:focus {
            outline: 2px solid #16a34a;
            border-color: transparent;
        }
        /* Responsive tweaks */
        @media (max-width: 480px) {
            .product-card .qty-control {
                flex-wrap: wrap;
                justify-content: center;
            }
            .product-card .qty-control input {
                width: 40px;
            }
        }
        @media (orientation: landscape) and (max-width: 768px) {
            .grid-cols-2 {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        #loader {
            background: white;
        }
        .pb-24 {
            padding-bottom: 6rem;
        }
        @media (max-width: 640px) {
            .pb-24 {
                padding-bottom: 5rem;
            }
        }
        /* Hamburger drawer */
        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 280px;
            max-width: 80%;
            height: 100%;
            background: white;
            z-index: 70;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 16px;
            margin-bottom: 20px;
        }
        .drawer-header h2 {
            font-size: 20px;
            font-weight: 800;
        }
        .drawer-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #64748b;
        }
        .drawer-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            transition: 0.2s;
            cursor: pointer;
        }
        .drawer-link:hover {
            color: #16a34a;
        }
        .drawer-link i {
            width: 24px;
            text-align: center;
            color: #64748b;
        }
        .drawer-link.logout {
            margin-top: auto;
            border-top: 1px solid #f1f5f9;
            padding-top: 16px;
            color: #ef4444;
        }
        .drawer-link.logout i {
            color: #ef4444;
        }
        .drawer-user {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 16px;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .hamburger-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #1e293b;
            padding: 8px;
        }
        @media (min-width: 1024px) {
            .hamburger-btn {
                display: none;
            }
        }
    </style>
</head>
<body class="pb-24">

    <div id="status-msg"></div>
    <div id="loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="mt-4 text-emerald-600 font-bold">Loading...</p>
    </div>

    <!-- Hamburger drawer -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h2>Balldress</h2>
            <button class="drawer-close" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="drawer-user" class="drawer-user">Guest</div>
        <a class="drawer-link" onclick="navigate('home')"><i class="fa-solid fa-house"></i> Home</a>
        <a class="drawer-link" onclick="navigate('orders')"><i class="fa-solid fa-box-open"></i> Orders</a>
        <a class="drawer-link" onclick="navigate('cart')"><i class="fa-solid fa-cart-shopping"></i> Cart</a>
        <a id="drawer-admin" class="drawer-link hidden" onclick="navigate('admin')"><i class="fa-solid fa-shield-halved"></i> Admin</a>
        <a id="drawer-auth" class="drawer-link logout" onclick="handleAuth()"><i class="fa-solid fa-right-to-bracket"></i> <span id="drawer-auth-text">Login</span></a>
    </div>

    <nav class="sticky top-0 z-40 nav-glass">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="showView('home')">
                <div class="w-8 h-8 sm:w-10 sm:h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-pen-nib text-sm sm:text-base"></i>
                </div>
                <h1 class="text-lg sm:text-xl font-extrabold text-slate-900">Balldress <span class="text-emerald-600">Buyer</span></h1>
            </div>
            <div class="flex items-center gap-2">
                <button class="hamburger-btn" onclick="toggleDrawer()" aria-label="Menu">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div id="nav-actions" class="flex items-center gap-2"></div>
            </div>
        </div>
    </nav>

    <main id="main-content" class="max-w-7xl mx-auto p-3 sm:p-4 pt-4 sm:pt-6"></main>

    <!-- Bottom bar (still works for logged‑in users) -->
    <div id="bottom-bar" class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 bg-white/95 backdrop-blur-xl border border-emerald-100 shadow-2xl rounded-full px-3 sm:px-6 py-1.5 sm:py-2 flex items-center gap-3 sm:gap-6 z-50 hidden">
        <button onclick="showView('home')" class="nav-icon p-2 sm:p-3 text-slate-400 text-base sm:text-lg" data-v="home"><i class="fa-solid fa-house"></i></button>
        <button onclick="showView('orders')" class="nav-icon p-2 sm:p-3 text-slate-400 text-base sm:text-lg" data-v="orders"><i class="fa-solid fa-box-open"></i></button>
        <button onclick="showView('cart')" class="nav-icon p-2 sm:p-3 text-slate-400 relative text-base sm:text-lg" data-v="cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="absolute -top-0.5 -right-0.5 bg-emerald-600 text-white text-[9px] sm:text-[10px] w-4 h-4 sm:w-5 sm:h-5 rounded-full hidden flex items-center justify-center font-bold">0</span>
        </button>
        <button id="admin-icon" onclick="showView('admin')" class="nav-icon p-2 sm:p-3 hidden text-emerald-400 text-base sm:text-lg" data-v="admin"><i class="fa-solid fa-shield-halved"></i></button>
    </div>

    <script>
        // ---------- Firebase ----------
        const firebaseConfig = {
            apiKey: "AIzaSyAp0BeH1zgsKRGI4itBpur919WX0FIg-uo",
            authDomain: "whupm-13cab.firebaseapp.com",
            databaseURL: "https://whupm-13cab-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "whupm-13cab",
            storageBucket: "whupm-13cab.firebasestorage.app",
            messagingSenderId: "178241688205",
            appId: "1:178241688205:web:d6e36734d4dac1440a08c4"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const ADMIN_EMAIL = "mourishnithin@outlook.com";
        const ADMIN_PASS_SECRET = "230914";

        const DEFAULT_PRODUCTS = [
            { id: 'p1', name: 'Parker Beta Standard', price: 250, icon: 'fa-pen-clip' },
            { id: 'p2', name: 'Figo panda liquid roller (Blue)', price: 70, icon: 'fa-pen-fancy' },
            { id: 'p3-blue', name: 'Pilot V7 (Blue)', price: 60, icon: 'fa-pen-nib' },
            { id: 'p3-black', name: 'Pilot V7 (Black)', price: 90, icon: 'fa-pen-nib' },
            { id: 'p4-blue', name: 'Reynold 045 (Blue)', price: 2, icon: 'fa-pencil' },
            { id: 'p4-black', name: 'Reynold 045 (Black)', price: 5, icon: 'fa-pencil' }
        ];

        // ----- State -----
        let productList = [...DEFAULT_PRODUCTS];
        let stockData = {};
        let wishlist = {};
        let ratings = {};
        let cart = [];
        let currentActiveView = 'home';
        let ordersListener = null;
        let currentUser = null;
        let userAddress = null;

        // ----- Drawer -----
        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('open');
            document.getElementById('drawer-overlay').classList.toggle('open');
        }
        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('open');
        }
        function navigate(view) {
            closeDrawer();
            if (view === 'home') showView('home');
            else if (view === 'orders') {
                if (currentUser) showView('orders');
                else { showMessage('Please log in first', 'error'); showView('login'); }
            } else if (view === 'cart') {
                if (currentUser) showView('cart');
                else { showMessage('Please log in first', 'error'); showView('login'); }
            } else if (view === 'admin') {
                if (currentUser && currentUser.email === ADMIN_EMAIL) showView('admin');
                else { showMessage('Unauthorized', 'error'); }
            }
        }
        function handleAuth() {
            closeDrawer();
            if (currentUser) {
                auth.signOut();
            } else {
                showView('login');
            }
        }

        // ----- UI Helpers -----
        function showMessage(text, type = 'info') {
            const el = document.getElementById('status-msg');
            el.innerText = text;
            el.style.display = 'block';
            el.className = type === 'error' ? 'bg-red-600 text-white shadow-xl' : 'bg-slate-800 text-white shadow-xl';
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => { el.style.display = 'none'; }, 2500);
        }

        function showView(view) {
            currentActiveView = view;
            document.querySelectorAll('.nav-icon').forEach(i => {
                i.classList.toggle('active', i.dataset.v === view);
            });
            if (view === 'home') renderHome();
            else if (view === 'login') renderAuth('login');
            else if (view === 'signup') renderAuth('signup');
            else if (view === 'cart') renderCart();
            else if (view === 'orders') renderOrders();
            else if (view === 'admin') renderAdmin();
            else if (view === 'product') renderProductDetail();
            closeDrawer(); // close drawer on view change
        }

        // ----- Real‑time listeners -----
        db.ref('prices').on('value', snap => {
            const priceData = snap.val() || {};
            productList = DEFAULT_PRODUCTS.map(p => ({
                ...p,
                price: priceData[p.id] !== undefined ? Number(priceData[p.id]) : p.price
            }));
            if (currentActiveView === 'home') renderHome();
            if (currentActiveView === 'admin') renderAdmin();
        });

        db.ref('stock').on('value', snap => {
            stockData = snap.val() || {};
            if (currentActiveView === 'home') renderHome();
            if (currentActiveView === 'admin') renderAdmin();
        });

        function listenWishlist(uid) {
            db.ref(`users/${uid}/wishlist`).on('value', snap => {
                wishlist = snap.val() || {};
                if (currentActiveView === 'home') renderHome();
            });
        }

        db.ref('ratings').on('value', snap => {
            ratings = snap.val() || {};
            if (currentActiveView === 'home') renderHome();
        });

        // ----- Auth state -----
        auth.onAuthStateChanged(user => {
            document.getElementById('loader').style.display = 'none';
            const bottom = document.getElementById('bottom-bar');
            bottom.classList.toggle('hidden', !user);
            const nav = document.getElementById('nav-actions');
            const drawerUser = document.getElementById('drawer-user');
            const drawerAuth = document.getElementById('drawer-auth');
            const drawerAuthText = document.getElementById('drawer-auth-text');
            const drawerAdmin = document.getElementById('drawer-admin');

            if (user) {
                currentUser = user;
                db.ref(`users/${user.uid}/address`).once('value', snap => {
                    userAddress = snap.val() || null;
                });
                listenWishlist(user.uid);

                nav.innerHTML = `
                    <button id="logout-btn" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center hover:bg-red-100 transition">
                        <i class="fa-solid fa-power-off text-sm sm:text-base"></i>
                    </button>`;
                document.getElementById('logout-btn').onclick = () => auth.signOut();

                drawerUser.textContent = user.email || 'User';
                drawerAuthText.textContent = 'Logout';
                drawerAuth.className = 'drawer-link logout';
                if (user.email === ADMIN_EMAIL) {
                    drawerAdmin.classList.remove('hidden');
                } else {
                    drawerAdmin.classList.add('hidden');
                }
                document.getElementById('admin-icon').classList.toggle('hidden', user.email !== ADMIN_EMAIL);

                if (ordersListener) {
                    ordersListener();
                    ordersListener = null;
                }

                if (user.email === ADMIN_EMAIL) {
                    showView('admin');
                } else {
                    showView('home');
                }
            } else {
                currentUser = null;
                nav.innerHTML = `<button onclick="showView('login')" class="m3-btn-green px-4 sm:px-6 py-1.5 sm:py-2 text-xs sm:text-sm">Login</button>`;
                drawerUser.textContent = 'Guest';
                drawerAuthText.textContent = 'Login';
                drawerAuth.className = 'drawer-link logout';
                drawerAdmin.classList.add('hidden');
                showView('home');
                if (ordersListener) ordersListener();
            }
        });

        // ----- Helper: Add to cart with quantity -----
        window.addToCartWithQty = (id, qtyInputId) => {
            const qtyInput = document.getElementById(qtyInputId);
            let qty = parseInt(qtyInput.value) || 1;
            if (qty < 1) qty = 1;
            const p = productList.find(x => x.id === id);
            if (!p) { showMessage('Product not found', 'error'); return; }
            const available = stockData[id] || 0;
            if (available < qty) { showMessage('Not enough stock', 'error'); return; }
            const ex = cart.find(x => x.id === id);
            if (ex) {
                const newQty = ex.qty + qty;
                if (newQty > available) { showMessage('Not enough stock', 'error'); return; }
                ex.qty = newQty;
            } else {
                cart.push({ ...p, qty });
            }
            updateCartUI();
            showMessage(`${qty} × ${p.name} added`);
        };

        // ----- Wishlist toggle -----
        window.toggleWishlist = (id) => {
            if (!currentUser) { showView('login'); return; }
            const newVal = !wishlist[id];
            db.ref(`users/${currentUser.uid}/wishlist/${id}`).set(newVal ? true : null);
        };

        // ----- Rating/review -----
        window.submitRating = (productId) => {
            if (!currentUser) { showView('login'); return; }
            const stars = parseInt(document.getElementById(`rating-stars-${productId}`).value);
            const comment = document.getElementById(`rating-comment-${productId}`).value.trim();
            if (!stars || stars < 1 || stars > 5) { showMessage('Select 1-5 stars', 'error'); return; }
            const review = {
                uid: currentUser.uid,
                name: currentUser.displayName || currentUser.email || 'Anonymous',
                rating: stars,
                comment: comment || '',
                date: new Date().toISOString()
            };
            db.ref(`ratings/${productId}/reviews`).push(review).then(() => {
                showMessage('Review added!');
                document.getElementById(`rating-comment-${productId}`).value = '';
            });
        };

        // ----- Order cancellation -----
        window.cancelOrder = (orderId) => {
            if (!confirm('Cancel this order?')) return;
            db.ref(`orders/${orderId}`).update({ status: 'Cancelled' })
                .then(() => showMessage('Order cancelled'));
        };

        // ----- Checkout with address -----
        window.checkout = async () => {
            if (!currentUser) { showView('login'); return; }
            if (cart.length === 0) { showMessage('Cart is empty', 'error'); return; }

            const addressLine = document.getElementById('address-line')?.value.trim();
            const city = document.getElementById('address-city')?.value.trim();
            const postal = document.getElementById('address-postal')?.value.trim();
            if (!addressLine || !city || !postal) {
                showMessage('Please fill in all address fields', 'error');
                return;
            }
            const address = { addressLine, city, postal };
            await db.ref(`users/${currentUser.uid}/address`).set(address);

            for (let item of cart) {
                const available = stockData[item.id] || 0;
                if (item.qty > available) {
                    showMessage(`Not enough stock for ${item.name}`, 'error');
                    return;
                }
            }

            const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            const orderData = {
                userId: currentUser.uid,
                userEmail: currentUser.email,
                items: cart.map(i => ({ ...i })),
                total: total,
                status: 'Processing',
                date: new Date().toISOString(),
                address: address
            };
            await db.ref('orders').push(orderData);
            cart = [];
            updateCartUI();
            showView('orders');
            showMessage('Order placed! 🎉');
        };

        // ----- Render functions -----

        function renderHome() {
            const searchTerm = document.getElementById('search-input')?.value?.toLowerCase() || '';
            let filtered = productList.filter(p => p.name.toLowerCase().includes(searchTerm));

            let html = `
                <div class="mb-4 sm:mb-6 p-4 sm:p-6 bg-emerald-100 rounded-[28px] sm:rounded-[32px] border border-emerald-200">
                    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div>
                            <h2 class="text-xl sm:text-2xl font-black text-emerald-900">Premium Pens</h2>
                            <p class="text-emerald-700 font-medium text-xs sm:text-sm">Real‑time inventory & prices.</p>
                        </div>
                        <div class="flex items-center gap-2 bg-white rounded-full px-3 sm:px-4 py-1.5 sm:py-2 shadow w-full sm:w-auto">
                            <i class="fa-solid fa-search text-slate-400 text-sm"></i>
                            <input id="search-input" placeholder="Search pens..." class="outline-none bg-transparent text-sm w-full sm:w-40 md:w-48" oninput="renderHome()" />
                        </div>
                    </div>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">`;

            filtered.forEach(p => {
                const stockQty = stockData[p.id] ?? 0;
                const isOut = stockQty <= 0;
                const inWishlist = wishlist[p.id] === true;
                const avgRating = ratings[p.id]?.average || 0;
                const ratingCount = ratings[p.id]?.count || 0;

                html += `
                    <div class="m3-card p-3 sm:p-4 flex flex-col items-center text-center ${isOut ? 'out-of-stock' : ''}">
                        <div class="flex justify-between w-full mb-1">
                            <span class="text-[9px] sm:text-xs text-slate-400">${stockQty} left</span>
                            <span class="wishlist-heart ${inWishlist ? 'text-red-500' : 'text-slate-300'} text-sm sm:text-base" onclick="toggleWishlist('${p.id}')">
                                <i class="fa-solid fa-heart"></i>
                            </span>
                        </div>
                        <div class="w-12 h-12 sm:w-14 sm:h-14 bg-emerald-50 rounded-2xl flex items-center justify-center text-lg sm:text-xl text-emerald-600 mb-2">
                            <i class="fa-solid ${p.icon}"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-[10px] sm:text-xs h-8 overflow-hidden leading-tight">${p.name}</h3>
                        <div class="flex items-center gap-1 text-[10px] sm:text-xs">
                            <span class="star-rating text-[11px] sm:text-sm">${'★'.repeat(Math.round(avgRating))}${'☆'.repeat(5-Math.round(avgRating))}</span>
                            <span class="text-slate-400">(${ratingCount})</span>
                        </div>
                        <p class="text-emerald-700 font-black my-1 text-sm sm:text-base">${p.price} BD</p>
                        ${isOut ?
                            `<div class="w-full py-1.5 bg-slate-200 text-slate-500 rounded-xl text-[9px] sm:text-[10px] font-black uppercase">Out of Stock</div>` :
                            `
                            <div class="flex items-center gap-1 sm:gap-2 my-1 qty-control">
                                <button onclick="document.getElementById('qty-${p.id}').stepDown();" class="w-5 h-5 sm:w-6 sm:h-6 bg-slate-100 rounded-full flex items-center justify-center text-xs">−</button>
                                <input id="qty-${p.id}" type="number" value="1" min="1" max="${stockQty}" class="w-8 sm:w-10 text-center border-none bg-transparent font-bold text-xs sm:text-sm" />
                                <button onclick="document.getElementById('qty-${p.id}').stepUp();" class="w-5 h-5 sm:w-6 sm:h-6 bg-slate-100 rounded-full flex items-center justify-center text-xs">+</button>
                            </div>
                            <button onclick="addToCartWithQty('${p.id}', 'qty-${p.id}')" class="m3-btn-green w-full py-1 text-[10px] sm:text-xs">Add to Bag</button>
                            `
                        }
                        <button onclick="showProductDetail('${p.id}')" class="text-[9px] sm:text-[10px] text-emerald-600 mt-1 underline">Details</button>
                    </div>`;
            });
            document.getElementById('main-content').innerHTML = html + `</div>`;
        }

        // Product detail view
        window.showProductDetail = (productId) => {
            currentActiveView = 'product';
            const p = productList.find(x => x.id === productId);
            if (!p) return;
            const stockQty = stockData[p.id] ?? 0;
            const reviews = ratings[p.id]?.reviews || {};
            const avg = ratings[p.id]?.average || 0;
            const count = ratings[p.id]?.count || 0;

            let html = `
                <div class="bg-white p-4 sm:p-6 rounded-[28px] sm:rounded-[32px] border border-emerald-100 mb-4">
                    <div class="flex items-center gap-4 mb-4">
                        <button onclick="showView('home')" class="text-slate-400"><i class="fa-solid fa-arrow-left"></i></button>
                        <h2 class="text-lg sm:text-xl font-black">${p.name}</h2>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="w-16 h-16 sm:w-20 sm:h-20 bg-emerald-50 rounded-3xl flex items-center justify-center text-2xl sm:text-3xl text-emerald-600">
                            <i class="fa-solid ${p.icon}"></i>
                        </div>
                        <p class="text-xl sm:text-2xl font-black text-emerald-700 my-2">${p.price} BD</p>
                        <p class="text-xs sm:text-sm text-slate-500">${stockQty} in stock</p>
                        <div class="flex items-center gap-1 my-2">
                            <span class="star-rating text-lg sm:text-xl">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span>
                            <span class="text-xs sm:text-sm text-slate-400">(${count} reviews)</span>
                        </div>
                        ${stockQty > 0 ? `
                            <div class="flex items-center gap-3 my-3">
                                <button onclick="document.getElementById('qty-detail').stepDown();" class="w-7 h-7 sm:w-8 sm:h-8 bg-slate-100 rounded-full flex items-center justify-center">−</button>
                                <input id="qty-detail" type="number" value="1" min="1" max="${stockQty}" class="w-12 sm:w-14 text-center border-none bg-transparent font-bold text-base sm:text-lg" />
                                <button onclick="document.getElementById('qty-detail').stepUp();" class="w-7 h-7 sm:w-8 sm:h-8 bg-slate-100 rounded-full flex items-center justify-center">+</button>
                            </div>
                            <button onclick="addToCartWithQty('${p.id}', 'qty-detail')" class="m3-btn-green px-6 sm:px-8 py-2 text-xs sm:text-sm">Add to Bag</button>
                        ` : `<div class="text-red-500 font-bold">Out of stock</div>`}
                    </div>
                </div>

                <!-- Reviews -->
                <div class="bg-white p-4 sm:p-6 rounded-[28px] sm:rounded-[32px] border border-emerald-100">
                    <h3 class="font-bold mb-4 text-sm sm:text-base">Reviews</h3>
                    ${Object.values(reviews).slice(0, 5).map(r => `
                        <div class="review-item">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="font-bold text-xs sm:text-sm">${r.name}</span>
                                <span class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
                                <span class="text-[9px] sm:text-[10px] text-slate-400">${new Date(r.date).toLocaleDateString()}</span>
                            </div>
                            <p class="text-xs sm:text-sm text-slate-600">${r.comment || 'No comment'}</p>
                        </div>
                    `).join('') || '<p class="text-slate-400 text-xs sm:text-sm">No reviews yet. Be the first!</p>'}

                    ${currentUser ? `
                        <div class="mt-4 border-t pt-4">
                            <p class="font-semibold text-xs sm:text-sm">Write a review</p>
                            <div class="flex items-center gap-2 my-2 flex-wrap">
                                <label class="text-xs sm:text-sm">Rating: </label>
                                <select id="rating-stars-${p.id}" class="border rounded-lg p-1 text-xs sm:text-sm">
                                    ${[1,2,3,4,5].map(s => `<option value="${s}">${s} ★</option>`).join('')}
                                </select>
                            </div>
                            <input id="rating-comment-${p.id}" placeholder="Your comment (optional)" class="w-full border rounded-xl p-2 text-xs sm:text-sm mb-2" />
                            <button onclick="submitRating('${p.id}')" class="m3-btn-green px-4 py-1.5 text-xs sm:text-sm">Submit</button>
                        </div>
                    ` : `<p class="text-xs sm:text-sm text-slate-400 mt-2">Login to leave a review.</p>`}
                </div>
            `;
            document.getElementById('main-content').innerHTML = html;
        };

        // ----- Admin -----
        function renderAdmin() {
            let html = `<h2 class="text-lg sm:text-xl font-black mb-4 sm:mb-6">Inventory Control</h2>
            <div class="bg-white p-4 sm:p-6 rounded-[28px] sm:rounded-[32px] border border-emerald-100 mb-6">
                <div class="space-y-3 sm:space-y-4">
                    ${productList.map(p => {
                        const stockQty = stockData[p.id] ?? 0;
                        const isOut = stockQty <= 0;
                        return `
                            <div class="flex flex-wrap items-center gap-2 sm:gap-3 p-3 sm:p-4 bg-slate-50 rounded-2xl">
                                <div class="flex-1 min-w-[100px]">
                                    <span class="text-[10px] sm:text-xs font-bold text-slate-700">${p.name}</span>
                                    <span class="ml-2 text-[9px] sm:text-[10px] text-slate-400">(${stockQty} left)</span>
                                </div>
                                <div class="flex items-center gap-1 sm:gap-2 flex-wrap">
                                    <span class="text-xs sm:text-sm font-bold text-emerald-600">${p.price} BD</span>
                                    <input type="number" id="price-input-${p.id}" value="${p.price}" class="w-16 sm:w-20 p-1 rounded-xl border text-center text-xs sm:text-sm" step="0.01" min="0" />
                                    <button onclick="updatePrice('${p.id}', document.getElementById('price-input-${p.id}').value)" class="px-2 sm:px-3 py-1 bg-emerald-100 text-emerald-700 rounded-xl text-[9px] sm:text-[10px] font-black hover:bg-emerald-200 transition">Save</button>
                                </div>
                                <button onclick="toggleStock('${p.id}', ${isOut})" class="px-2 sm:px-3 py-1 rounded-xl text-[9px] sm:text-[10px] font-black transition-colors ${isOut ? 'bg-red-500 text-white' : 'bg-emerald-100 text-emerald-700'}">
                                    ${isOut ? 'Mark In' : 'Mark Out'}
                                </button>
                            </div>`;
                    }).join('')}
                </div>
            </div>
            <div id="admin-orders"></div>`;

            document.getElementById('main-content').innerHTML = html;

            if (ordersListener) {
                ordersListener();
                ordersListener = null;
            }

            ordersListener = db.ref('orders').on('value', snap => {
                let oHtml = `<h3 class="font-bold px-2 mb-4 flex items-center gap-2 text-sm sm:text-base">
                    <i class="fa-solid fa-receipt text-emerald-600"></i> All Customer Orders
                    <span class="text-xs text-slate-400 font-normal ml-2">(${snap.numChildren()})</span>
                </h3>`;
                if (!snap.exists()) {
                    oHtml += `<div class="bg-white p-8 rounded-3xl text-center text-slate-400 text-sm">No orders yet.</div>`;
                } else {
                    snap.forEach(c => {
                        const o = c.val();
                        const items = o.items || [];
                        const total = o.total || items.reduce((s, i) => s + (i.price * i.qty), 0);
                        oHtml += `
                            <div class="bg-white p-4 sm:p-5 rounded-3xl border border-emerald-50 mb-4 shadow-sm">
                                <div class="flex flex-wrap items-start justify-between gap-2 mb-3">
                                    <div>
                                        <span class="text-[9px] sm:text-[10px] font-black text-slate-300 bg-slate-100 px-2 py-1 rounded-lg">#${c.key.slice(-6)}</span>
                                        <span class="text-[10px] sm:text-xs font-semibold text-slate-600 ml-2"><i class="fa-regular fa-envelope"></i> ${o.userEmail || 'unknown'}</span>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-xs sm:text-sm font-black text-emerald-700">${total} BD</span>
                                        <span class="px-2 py-1 rounded-lg text-[9px] sm:text-[10px] font-bold ${o.status === 'Delivered' ? 'bg-emerald-100 text-emerald-700' : o.status === 'Shipped' ? 'bg-blue-100 text-blue-700' : 'bg-amber-100 text-amber-700'}">${o.status || 'Processing'}</span>
                                    </div>
                                </div>
                                <div class="flex flex-wrap gap-1.5 mt-2 mb-3">
                                    ${items.map(item => `
                                        <span class="bg-slate-100 rounded-full px-2 py-0.5 text-[9px] sm:text-[10px] font-semibold">
                                            ${item.name} ×${item.qty}
                                        </span>
                                    `).join('')}
                                </div>
                                <div class="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-slate-100">
                                    <select onchange="updateOrderStatus('${c.key}', this.value)" class="flex-1 min-w-[100px] bg-slate-50 p-2 rounded-xl text-xs font-bold border-none focus:ring-2 focus:ring-emerald-300 outline-none">
                                        <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                        <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                                        <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                                        <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                    </select>
                                    <button onclick="deleteOrder('${c.key}')" class="px-3 sm:px-4 py-2 bg-red-50 text-red-400 rounded-xl hover:bg-red-100 transition"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('admin-orders').innerHTML = oHtml;
            });
        }

        window.toggleStock = (id, setIn) => {
            const newQty = setIn ? 10 : 0;
            db.ref(`stock/${id}`).set(newQty);
        };

        window.updatePrice = (id, val) => {
            const num = parseFloat(val);
            if (isNaN(num) || num < 0) { showMessage('Invalid price', 'error'); return; }
            db.ref(`prices/${id}`).set(num);
        };

        window.updateOrderStatus = (id, status) => {
            db.ref(`orders/${id}/status`).set(status);
        };

        window.deleteOrder = (id) => {
            if (confirm('Delete this order?')) db.ref(`orders/${id}`).remove();
        };

        // ----- Cart -----
        function renderCart() {
            let total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            let html = `<h2 class="text-lg sm:text-xl font-black mb-4 sm:mb-6">Your Bag</h2>`;
            if (cart.length === 0) {
                html += `<div class="p-10 text-center text-slate-400 bg-white rounded-[32px] text-sm">Empty</div>`;
            } else {
                cart.forEach(item => {
                    html += `
                        <div class="bg-white p-3 sm:p-4 rounded-3xl flex items-center justify-between mb-3 border border-emerald-50">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 sm:w-10 sm:h-10 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600 text-sm sm:text-base">
                                    <i class="fa-solid ${item.icon}"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-xs sm:text-sm">${item.name}</p>
                                    <p class="text-[10px] sm:text-xs text-emerald-500 font-bold">${item.price} BD</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="changeQty('${item.id}', -1)" class="w-7 h-7 sm:w-8 sm:h-8 bg-slate-100 rounded-lg flex items-center justify-center">−</button>
                                <span class="text-xs sm:text-sm font-bold w-6 text-center">${item.qty}</span>
                                <button onclick="changeQty('${item.id}', 1)" class="w-7 h-7 sm:w-8 sm:h-8 bg-slate-100 rounded-lg flex items-center justify-center">+</button>
                            </div>
                        </div>`;
                });

                // Address collection
                html += `
                    <div class="bg-white p-4 sm:p-5 rounded-3xl border border-emerald-100 mt-4">
                        <h3 class="font-bold mb-3 text-sm sm:text-base">Shipping Address</h3>
                        <div class="space-y-3">
                            <input id="address-line" placeholder="Street address" class="address-field text-xs sm:text-sm" value="${userAddress?.addressLine || ''}" />
                            <div class="flex flex-col sm:flex-row gap-3">
                                <input id="address-city" placeholder="City" class="address-field text-xs sm:text-sm" value="${userAddress?.city || ''}" />
                                <input id="address-postal" placeholder="Postal code" class="address-field text-xs sm:text-sm" value="${userAddress?.postal || ''}" />
                            </div>
                        </div>
                    </div>
                `;

                html += `
                    <button onclick="checkout()" class="w-full bg-emerald-600 text-white py-3 sm:py-4 rounded-2xl font-black mt-4 shadow-lg text-sm sm:text-base">
                        ${total} BD — Place Order
                    </button>`;
            }
            document.getElementById('main-content').innerHTML = html;
        }

        window.changeQty = (id, delta) => {
            const item = cart.find(x => x.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
            }
            updateCartUI();
            renderCart();
        };

        function updateCartUI() {
            const count = cart.reduce((s, i) => s + i.qty, 0);
            const c = document.getElementById('cart-count');
            c.innerText = count;
            c.classList.toggle('hidden', count === 0);
        }

        // ----- Orders (user) with timeline and cancel -----
        function renderOrders() {
            document.getElementById('main-content').innerHTML = `
                <h2 class="text-lg sm:text-xl font-black mb-4 sm:mb-6">Your Orders</h2>
                <div id="user-orders" class="space-y-3"></div>
            `;

            if (ordersListener) {
                ordersListener();
                ordersListener = null;
            }

            ordersListener = db.ref('orders').on('value', snap => {
                const container = document.getElementById('user-orders');
                if (!container) return;
                let html = '';
                let found = false;

                snap.forEach(c => {
                    const o = c.val();
                    if (currentUser && o.userId === currentUser.uid) {
                        found = true;
                        const items = o.items || [];
                        const total = o.total || items.reduce((s, i) => s + (i.price * i.qty), 0);
                        const status = o.status || 'Processing';
                        const steps = ['Processing', 'Shipped', 'Delivered'];
                        const currentStep = steps.indexOf(status);
                        const isCancelled = status === 'Cancelled';

                        html += `
                            <div class="bg-white p-4 sm:p-5 rounded-3xl border border-emerald-50 shadow-sm">
                                <div class="flex flex-wrap items-start justify-between gap-2 mb-2">
                                    <span class="text-[9px] sm:text-[10px] font-black text-slate-300 bg-slate-100 px-2 py-1 rounded-lg">#${c.key.slice(-6)}</span>
                                    <span class="px-2 py-1 rounded-lg text-[9px] sm:text-[10px] font-bold ${status === 'Delivered' ? 'bg-emerald-100 text-emerald-700' : status === 'Shipped' ? 'bg-blue-100 text-blue-700' : status === 'Cancelled' ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'}">${status}</span>
                                </div>

                                <!-- Timeline -->
                                <div class="order-timeline my-3 text-[10px] sm:text-xs">
                                    ${steps.map((s, idx) => `
                                        <span class="timeline-step ${idx <= currentStep ? (idx === currentStep ? 'active' : 'done') : ''}">
                                            ${idx <= currentStep ? (idx === currentStep ? '●' : '✓') : '○'} ${s}
                                        </span>
                                        ${idx < steps.length - 1 ? `<span class="timeline-line ${idx < currentStep ? 'done' : ''}"></span>` : ''}
                                    `).join('')}
                                </div>

                                <div class="flex flex-wrap gap-1.5 my-2">
                                    ${items.map(item => `
                                        <span class="bg-slate-100 rounded-full px-2 py-0.5 text-[9px] sm:text-[10px] font-semibold">
                                            ${item.name} ×${item.qty}
                                        </span>
                                    `).join('')}
                                </div>

                                <div class="flex flex-wrap justify-between items-center mt-3 pt-3 border-t border-slate-100 gap-2">
                                    <span class="text-xs sm:text-sm font-black text-emerald-700">${total} BD</span>
                                    <div class="flex items-center gap-2">
                                        ${!isCancelled && status === 'Processing' ? `
                                            <button onclick="cancelOrder('${c.key}')" class="text-red-500 text-[10px] sm:text-xs font-bold underline">Cancel</button>
                                        ` : ''}
                                        <span class="text-[9px] sm:text-[10px] text-slate-400">${o.date ? new Date(o.date).toLocaleDateString() : ''}</span>
                                    </div>
                                </div>
                                ${o.address ? `
                                    <div class="text-[9px] sm:text-[10px] text-slate-400 mt-2 border-t pt-2">
                                        📦 ${o.address.addressLine}, ${o.address.city}, ${o.address.postal}
                                    </div>
                                ` : ''}
                            </div>`;
                    }
                });

                container.innerHTML = found ? html : `<div class="bg-white p-10 rounded-3xl text-center text-slate-400 text-sm">No orders yet.</div>`;
            });
        }

        // ----- Auth views -----
        function renderAuth(type) {
            document.getElementById('main-content').innerHTML = `
                <div class="max-w-sm mx-auto bg-white p-6 sm:p-8 rounded-[40px] shadow-2xl mt-10">
                    <h2 class="text-xl sm:text-2xl font-black text-center mb-6">${type === 'login' ? 'Welcome Back' : 'Create Account'}</h2>
                    <form id="auth-form" class="space-y-4">
                        <input type="email" id="email" placeholder="Email" class="w-full bg-slate-50 p-3 sm:p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-300 text-sm sm:text-base" required />
                        <input type="password" id="pass" placeholder="Password" class="w-full bg-slate-50 p-3 sm:p-4 rounded-2xl outline-none focus:ring-2 focus:ring-emerald-300 text-sm sm:text-base" required />
                        <button type="submit" class="w-full m3-btn-green py-3 sm:py-4 mt-2 text-sm sm:text-base">${type === 'login' ? 'Login' : 'Sign Up'}</button>
                    </form>
                    <p class="text-center mt-6 text-xs sm:text-sm text-slate-400 cursor-pointer" onclick="showView('${type === 'login' ? 'signup' : 'login'}')">
                        ${type === 'login' ? 'New here? <span class="text-emerald-600 font-bold">Sign up</span>' : 'Have an account? <span class="text-emerald-600 font-bold">Login</span>'}
                    </p>
                </div>`;

            document.getElementById('auth-form').onsubmit = async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const pass = document.getElementById('pass').value;
                try {
                    if (type === 'login') {
                        await auth.signInWithEmailAndPassword(email, (email === ADMIN_EMAIL ? ADMIN_PASS_SECRET : pass));
                    } else {
                        await auth.createUserWithEmailAndPassword(email, pass);
                        showMessage('Account created! You can now log in.', 'info');
                    }
                } catch (err) {
                    showMessage(err.message, 'error');
                }
            };
        }
    </script>
</body>
</html>
